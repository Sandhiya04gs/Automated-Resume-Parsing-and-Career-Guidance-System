<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Resume</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: white;
      font-family: "Segoe UI", sans-serif;
    }

    /* Page wrapper */
    .page-wrapper {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    /* A4 Paper Style */
    .a4-paper {
      width: 90%;
      max-width: 900px;
      min-height: 550px;
      background:rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 60px 50px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
      transition: 0.3s ease;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 60px;
    }
    /* Drag & Drop */
    .drop-zone {
      border: 2px dashed #2563eb;
      border-radius: 16px;
      padding: 60px 30px;
      max-width: 500px;
      margin: auto;
      cursor: pointer;
      transition: 0.3s ease, transform 0.3s ease;
      background: #f8fafc;
    }

    .drop-zone.dragover {
      background: #eff6ff;
      border-color: #1d4ed8;
      transform: scale(1.05);
    }
    .drop-zone input {
      display: none;
    }

    .drop-text {
      font-size: 18px;
      font-weight: 600;
      color: #1e40af;
    }

    .file-name {
      margin-top: 15px;
      font-size: 15px;
      color: #374151;
    }





    /* Upload box */
    .upload-box {
      border: 2px dashed #2563eb;
      border-radius: 12px;
      padding: 40px 20px;
      margin: 0 auto 40px;
      max-width: 420px;
      cursor: pointer;
    }

    .upload-box input {
      border: none;
      outline: none;
      width: 100%;
    }

    .upload-btn {
      background: #16a34a;
      margin-top: 50px;
      color: #fff;
      border: none;
      padding: 16px 50px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .upload-btn:hover {
      background: #15803d;
    }

    .privacy {
      margin-top: 80px;
      font-size: 14px;
      color: #6b7280;
    }

    /* AI Scanning Loader */
.ai-loader {
  margin-top: 50px;
}

.scanner {
  width: 320px;
  height: 200px;
  border: 2px solid #2563eb;
  border-radius: 10px;
  position: relative;
  margin: 0 auto 20px;
  overflow: hidden;
  background: linear-gradient(180deg, #f8fafc, #e0e7ff);
}

.scan-line {
  position: absolute;
  width: 100%;
  height: 25px;
  background: linear-gradient(90deg, transparent, #2563eb, transparent);
  animation: scan 2s infinite;

}

@keyframes scan {
  0% { top: 0; }
  100% { top: 100%; }
}

.scan-text {
  font-size: 16px;
  font-weight: 600;
  color: #1e40af;
}


    /* Mobile */
    @media (max-width: 900px) {
      .a4-paper {
        width: 95%;
        padding: 40px 25px;
      }
    }
  </style>
</head>

<body>

<div class="page-wrapper">

  <!-- A4 Resume Upload Paper -->
  <div class="a4-paper">

    <h2 class="title">📄 Upload Your Resume</h2>
    <p class="subtitle">Drag & drop or click to upload (PDF, DOCX)</p>

    <form id="resumeForm"
          action="{{ url_for('upload_resume') }}"
          method="POST"
          enctype="multipart/form-data">

    <label class="drop-zone" id="drop-zone">
        <input type="file" name="resume" id="fileInput" required>
        <div class="drop-text">📤 Drop your resume here</div>
        <div class="file-name" id="fileName"></div>
    </label>

    <!-- AI Scanning Loader -->
<div id="ai-loader" class="ai-loader" style="display:none;">
  <div class="scanner">
    <div class="scan-line"></div>
  </div>
  <p class="scan-text">🤖 AI is scanning your resume…</p>
</div>
    <center>
      <button type="submit" class="upload-btn">
        Analyze Resume
      </button>
    </center>

    

    </form>

    <p class="privacy">🔒 Your resume is private and securely processed</p>

  </div>

</div>
<script>
  const dropZone = document.getElementById("drop-zone");
  const fileInput = document.getElementById("fileInput");
  const fileName = document.getElementById("fileName");
  const form = document.getElementById("resumeForm");
  const loader = document.getElementById("ai-loader");
  const uploadBtn = document.querySelector(".upload-btn");

  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
  });

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    fileInput.files = e.dataTransfer.files;
    fileName.innerText = e.dataTransfer.files[0].name;
  });

  fileInput.addEventListener("change", () => {
    fileName.innerText = fileInput.files[0].name;
  });

  form.addEventListener("submit", (e) => {
    const file = fileInput.files[0];
    if(!file.name.endsWith(".pdf") && !file.name.endsWith(".docx")){
        e.preventDefault();
        alert("Only PDF or DOCX files are allowed!");
    }
});

</script>


</body>
</html>
